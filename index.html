<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kokpit rutin — ZATE</title>
</head>
<body>
<style>
/* ============================================================
   TOKENY — komponenty se stylují výhradně přes ně
   ============================================================ */
:root {
  color-scheme: light;

  --ground:    #eceff4;
  --panel:     #ffffff;
  --panel-2:   #f6f8fa;
  --ink:       #0f141a;
  --ink-mid:   #4d5764;
  --ink-soft:  #79838f;
  --rule:      #d5dbe4;
  --rule-soft: #e5e9ef;

  --accent:      #1f5c8f;
  --accent-ink:  #ffffff;
  --accent-soft: #e3edf6;

  --crit:    #a8261d;
  --crit-bg: #fbe9e7;
  --ok:      #16693b;
  --ok-bg:   #e4f3e9;
  --warn:    #7d5200;
  --warn-bg: #fbf0d9;
  --idle-bg: #e8ebf0;

  --rep-1: #1f5c8f;
  --rep-2: #5d4a9c;
  --rep-3: #0f6b62;

  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --edge: 4px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;

    --ground:    #0e1217;
    --panel:     #161b22;
    --panel-2:   #1c222b;
    --ink:       #e8ecf2;
    --ink-mid:   #a3adbb;
    --ink-soft:  #77828f;
    --rule:      #242c37;
    --rule-soft: #1e2530;

    --accent:      #67a8dc;
    --accent-ink:  #08121b;
    --accent-soft: #17293a;

    --crit:    #f0897e;
    --crit-bg: #35191a;
    --ok:      #6cc78e;
    --ok-bg:   #14291d;
    --warn:    #e0ae5b;
    --warn-bg: #2e2413;
    --idle-bg: #232a34;

    --rep-1: #67a8dc;
    --rep-2: #a992e0;
    --rep-3: #4fb5a6;
  }
}

/* Přepínač témat na kořeni musí přebít media query v obou směrech */
:root[data-theme="light"] {
  color-scheme: light;
  --ground:    #eceff4;
  --panel:     #ffffff;
  --panel-2:   #f6f8fa;
  --ink:       #0f141a;
  --ink-mid:   #4d5764;
  --ink-soft:  #79838f;
  --rule:      #d5dbe4;
  --rule-soft: #e5e9ef;
  --accent:      #1f5c8f;
  --accent-ink:  #ffffff;
  --accent-soft: #e3edf6;
  --crit:    #a8261d;
  --crit-bg: #fbe9e7;
  --ok:      #16693b;
  --ok-bg:   #e4f3e9;
  --warn:    #7d5200;
  --warn-bg: #fbf0d9;
  --idle-bg: #e8ebf0;
  --rep-1: #1f5c8f;
  --rep-2: #5d4a9c;
  --rep-3: #0f6b62;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:    #0e1217;
  --panel:     #161b22;
  --panel-2:   #1c222b;
  --ink:       #e8ecf2;
  --ink-mid:   #a3adbb;
  --ink-soft:  #77828f;
  --rule:      #242c37;
  --rule-soft: #1e2530;
  --accent:      #67a8dc;
  --accent-ink:  #08121b;
  --accent-soft: #17293a;
  --crit:    #f0897e;
  --crit-bg: #35191a;
  --ok:      #6cc78e;
  --ok-bg:   #14291d;
  --warn:    #e0ae5b;
  --warn-bg: #2e2413;
  --idle-bg: #232a34;
  --rep-1: #67a8dc;
  --rep-2: #a992e0;
  --rep-3: #4fb5a6;
}

/* ============================================================
   ZÁKLAD
   ============================================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Číselný materiál — doklady, materiály, množství, data */
.num, .fig, .code, td.n, .mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* ============================================================
   HLAVIČKA
   ============================================================ */
.bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}

.bar-id { display: flex; flex-direction: column; gap: 1px; margin-right: 6px; }
.bar-id b { font-size: .98rem; font-weight: 650; letter-spacing: -.01em; }
.bar-id span {
  font-family: var(--mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink-soft);
}

.bar-spacer { flex: 1 1 auto; }

.bar-date {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: .78rem;
  color: var(--ink-mid);
}

/* ============================================================
   TLAČÍTKA
   ============================================================ */
.btn {
  font: inherit;
  font-size: .84rem;
  font-weight: 600;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  padding: 7px 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--panel-2); border-color: var(--ink-soft); }

.btn.go {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn.go:hover { filter: brightness(1.1); background: var(--accent); }

.btn.bare {
  border-color: transparent;
  background: none;
  color: var(--ink-mid);
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 7px 6px;
}
.btn.bare:hover { color: var(--ink); background: none; border-color: transparent; }

/* ============================================================
   OBSAH
   ============================================================ */
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 26px 22px 72px;
}

.lede {
  color: var(--ink-mid);
  font-size: .9rem;
  max-width: 62ch;
  margin: 0 0 22px;
}

/* ---------- přístrojové dlaždice ---------- */
.board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(268px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  overflow: hidden;
}

.tile {
  display: flex;
  flex-direction: column;
  gap: 3px;
  align-items: flex-start;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--panel);
  border: 0;
  padding: 18px 20px 16px;
  cursor: pointer;
  transition: background .12s ease;
}
.tile:hover { background: var(--panel-2); }

.tile-code {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--tile-hue);
}

.tile-name {
  font-size: .92rem;
  font-weight: 620;
  text-wrap: balance;
  line-height: 1.3;
}

.tile-cz { font-size: .8rem; color: var(--ink-soft); }

.tile-fig {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 2.5rem;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -.03em;
  margin-top: 10px;
}
.tile-fig i {
  font-style: normal;
  font-family: var(--sans);
  font-size: .88rem;
  font-weight: 500;
  color: var(--ink-mid);
  margin-left: 7px;
  letter-spacing: 0;
}

.tile-state {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: .82rem;
  color: var(--ink-mid);
  margin-top: 4px;
}
.tile-state .bad { color: var(--crit); font-weight: 620; }
.tile-state .good { color: var(--ok); }

.tile-go {
  margin-top: 12px;
  font-size: .8rem;
  font-weight: 620;
  color: var(--tile-hue);
}

/* ---------- záhlaví reportu ---------- */
.head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.head .back { font-size: .85rem; font-weight: 620; }
.head .rule { color: var(--ink-soft); }
.head h2 {
  margin: 0;
  font-size: 1.16rem;
  font-weight: 650;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.head h2 .code { color: var(--hue); font-weight: 700; }

.head-sub {
  font-size: .84rem;
  color: var(--ink-soft);
  margin: 0 0 16px;
}

/* ---------- filtry ---------- */
.tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 14px;
}

.tools input[type="search"] {
  flex: 1 1 210px;
  max-width: 300px;
  font: inherit;
  font-size: .86rem;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  padding: 7px 11px;
}
.tools input[type="search"]::placeholder { color: var(--ink-soft); }

.seg {
  display: flex;
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  overflow: hidden;
}
.seg button {
  font: inherit;
  font-size: .82rem;
  font-weight: 600;
  color: var(--ink-mid);
  background: var(--panel);
  border: 0;
  border-right: 1px solid var(--rule);
  padding: 7px 14px;
  cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--panel-2); }
.seg button.on { background: var(--ink); color: var(--panel); }

/* ---------- tabulka ---------- */
.sheet {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  overflow-x: auto;
}

table { border-collapse: collapse; width: 100%; min-width: 900px; }

thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  text-align: left;
  font-family: var(--mono);
  font-size: .68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--ink-soft);
  background: var(--panel);
  padding: 11px 14px 9px;
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}
thead th.r { text-align: right; }

tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule-soft);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--panel-2); }

td.n { text-align: right; white-space: nowrap; }

/* Řádek po termínu nese barevnou hranu — stav čitelný tvarem, ne jen textem */
tbody tr.overdue td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
tbody tr.settled td:first-child { box-shadow: inset 3px 0 0 var(--ok); }

.doc { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.doc em { font-style: normal; font-weight: 400; color: var(--ink-soft); }

/* Sapové číslo materiálu je hlavní identifikátor — katalogové pod ním */
.mat {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  font-size: .95rem;
  display: block;
}
.mat-cat {
  font-family: var(--mono);
  font-size: .76rem;
  color: var(--ink-soft);
  display: block;
  margin-top: 1px;
}

.soft { color: var(--ink-soft); font-size: .82rem; }
.errtext { color: var(--crit); font-size: .85rem; max-width: 300px; }

.dispo {
  display: inline-block;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: .76rem;
  font-weight: 650;
  background: var(--idle-bg);
  color: var(--ink-mid);
  border-radius: 3px;
  padding: 2px 6px;
}

.pill {
  display: inline-block;
  font-size: .74rem;
  font-weight: 650;
  border-radius: 3px;
  padding: 3px 8px;
  white-space: nowrap;
}
.pill.idle { background: var(--idle-bg); color: var(--ink-mid); }
.pill.bad  { background: var(--crit-bg); color: var(--crit); }
.pill.good { background: var(--ok-bg); color: var(--ok); }
.pill.hold { background: var(--warn-bg); color: var(--warn); }

.blank {
  padding: 46px 20px;
  text-align: center;
  color: var(--ink-mid);
  font-size: .9rem;
}

/* ---------- prázdný stav na přehledu ---------- */
.onboard {
  margin-top: 20px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  padding: 22px 24px;
}
.onboard h3 { margin: 0 0 6px; font-size: .98rem; font-weight: 650; }
.onboard p { margin: 0 0 14px; color: var(--ink-mid); font-size: .88rem; max-width: 58ch; }
.onboard ol {
  margin: 0 0 16px;
  padding-left: 20px;
  color: var(--ink-mid);
  font-size: .88rem;
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-width: 58ch;
}
.onboard code {
  font-family: var(--mono);
  font-size: .84rem;
  background: var(--idle-bg);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink);
}

/* ---------- popover dispo ---------- */
details.pick { position: relative; }
details.pick > summary {
  list-style: none;
  font-size: .84rem;
  font-weight: 600;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  padding: 7px 13px;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
details.pick > summary::-webkit-details-marker { display: none; }
details.pick > summary:hover { background: var(--panel-2); }
details.pick[open] > summary { background: var(--ink); border-color: var(--ink); color: var(--panel); }

.pop {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  min-width: 262px;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  box-shadow: 0 10px 30px rgba(0,0,0,.16);
  padding: 7px;
  z-index: 60;
}
.pop .hint { font-size: .76rem; color: var(--ink-soft); padding: 5px 8px 8px; }
.pop label {
  display: flex;
  gap: 9px;
  align-items: baseline;
  padding: 7px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: .86rem;
}
.pop label:hover { background: var(--panel-2); }
.pop .c {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.pop .d { color: var(--ink-soft); font-size: .8rem; }
.pop .clear {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: .82rem;
  font-weight: 620;
  color: var(--accent);
  background: none;
  border: 0;
  border-top: 1px solid var(--rule);
  margin-top: 5px;
  padding: 9px 8px 4px;
  cursor: pointer;
}

/* ---------- dialog ---------- */
dialog {
  margin: auto;
  max-width: 470px;
  width: calc(100% - 36px);
  padding: 0;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--edge);
  box-shadow: 0 20px 60px rgba(0,0,0,.32);
}
dialog::backdrop { background: rgba(6,10,14,.52); }

.dlg-body { padding: 20px 22px; }
.dlg-body h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 650; text-wrap: balance; }
.dlg-sub { color: var(--ink-mid); font-size: .85rem; margin: 0 0 16px; }

.f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 13px; }
.f > label {
  font-family: var(--mono);
  font-size: .7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-soft);
}
.f input, .f textarea {
  font: inherit;
  font-size: .88rem;
  width: 100%;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 8px 10px;
}
.f input[type="number"], .f input[type="date"] {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
.f textarea { font-family: var(--mono); font-size: .76rem; min-height: 130px; resize: vertical; }
.f input[type="file"] { font-family: var(--sans); font-size: .82rem; border: 0; padding: 4px 0; }

.dlg-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 13px 22px;
  background: var(--panel-2);
  border-top: 1px solid var(--rule);
}

/* ---------- toast ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(14px);
  max-width: 88vw;
  background: var(--ink);
  color: var(--panel);
  font-size: .87rem;
  padding: 10px 18px;
  border-radius: var(--edge);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 80;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

footer {
  text-align: center;
  color: var(--ink-soft);
  font-size: .78rem;
  padding: 0 22px 26px;
}
</style>

<header class="bar">
  <span class="bar-id">
    <b>Kokpit rutin</b>
    <span>ZATE · denní odbavení</span>
  </span>
  <span class="bar-spacer"></span>
  <span class="bar-date" id="today"></span>
  <details class="pick" id="pick">
    <summary id="pickLabel">Dispo: vše</summary>
    <div class="pop">
      <div class="hint">Vyber svoje dispo kódy — dlaždice i reporty pak ukazují jen tvoje položky. Nic nevybráno = vše.</div>
      <div id="pickOpts"></div>
      <button class="clear" id="pickClear" type="button">Zrušit výběr (zobrazit vše)</button>
    </div>
  </details>
  <button class="btn go" id="btnImport" type="button">Import ze ZATE</button>
  <button class="btn" id="btnWipe" type="button">Vymazat data</button>
</header>

<main id="app"></main>

<footer>Data zůstávají v tomto prohlížeči · ostrá verze by četla a zapisovala do SAP přes OData / RFC vrstvu</footer>

<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   ÚLOŽIŠTĚ
   Stav (vyřízeno / otevřeno) přežije nový import téhož reportu —
   páruje se přes klíč doklad+položka.
   ============================================================ */

const KEY_DATA  = "kokpit-zate-data";
const KEY_DISPO = "kokpit-zate-dispo";

let store = { zakazky: [], banfy: [], chyby: [], dispoNames: {} };

function loadStore() {
  try {
    const raw = localStorage.getItem(KEY_DATA);
    if (raw) { store = JSON.parse(raw); return true; }
  } catch (e) { /* nedostupné nebo poškozené → prázdný start */ }
  return false;
}
function saveStore() {
  try { localStorage.setItem(KEY_DATA, JSON.stringify(store)); } catch (e) {}
}

/* ============================================================
   PARSOVÁNÍ EXPORTŮ ZATE
   ============================================================ */

function detectReport(text) {
  if (/Unconfirmed Customer Orders/i.test(text)) return "zakazky";
  if (/purchase requisitions/i.test(text)) return "banfy";
  if (/Fehlerprotokolle|Lieferanlage/i.test(text)) return "chyby";
  return null;
}

function tok(line) { return line.split("\t").map(t => t.trim()).filter(t => t !== ""); }

function parseDate(s) {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec((s || "").trim());
  return m ? `${m[3]}-${m[2]}-${m[1]}` : null;
}

function parseQty(s) { return parseFloat((s || "0").replace(/\./g, "").replace(",", ".")); }

/* 500 116 — Unconfirmed Customer Orders
   MRPCn | Description | Material | Sales Doc. | Item | Deliv. date | Open Qty | SU | Created | DS | DPrio | DlBl | DB */
function parseZakazky(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    const t = tok(line);
    if (t.length < 11) continue;
    if (!/^\d{3}$/.test(t[0]) || !/^\d{6,8}$/.test(t[3])) continue;
    const datum = parseDate(t[5]);
    if (!datum) continue;
    out.push({
      key: `${t[3]}-${t[4]}`,
      dispo: t[0], popis: t[1], material: t[2], doklad: t[3], pol: t[4],
      datum, mnozstvi: parseQty(t[6]), mj: t[7], vytvoreno: parseDate(t[8]),
      ds: t[9] || "", dprio: t[10] || "", dlbl: t[11] || "", db: t[12] || "",
      stav: "open"
    });
  }
  return out;
}

/* 212 020 — Current purchase requisitions
   Plnt | Dv | PGr | MRPC | Product hierarchy | Purch.Req. | Item | Material | Short Text |
   Qty Requested | Un | Req.Date | Deliv. Date | Fix. Vend. | Name 1 | Fx | Fixed */
function parseBanfy(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    const t = tok(line);
    if (t.length < 13) continue;
    if (!/^\d{4}$/.test(t[0]) || !/^\d{8}$/.test(t[5])) continue;
    const reqDate = parseDate(t[11]), delivDate = parseDate(t[12]);
    if (!reqDate || !delivDate) continue;
    const tail = t.slice(13);
    let fixed = false;
    if (tail.length && /^(Yes|No)$/i.test(tail[tail.length - 1])) fixed = /yes/i.test(tail.pop());
    if (tail.length && tail[tail.length - 1] === "X") tail.pop();
    out.push({
      key: `${t[5]}-${t[6]}`,
      zavod: t[0], pgr: t[2], dispo: t[3], hier: t[4],
      banf: t[5], pol: t[6], material: t[7], text: t[8],
      mnozstvi: parseQty(t[9]), mj: t[10], reqDate, delivDate,
      dodavatel: tail.join(" "), fixed,
      stav: "open"
    });
  }
  return out;
}

/* 500 108 — Fehlerprotokolle Lieferanlage
   Řádky se opakují v každém běhu → slučuje se podle Doklad+Položka+Msg,
   drží se poslední běh a počet výskytů. */
function parseChyby(text) {
  const map = new Map();
  for (const line of text.split(/\r?\n/)) {
    const t = tok(line);
    if (t.length < 15) continue;
    const datum = parseDate(t[0]);
    if (!datum || !/^\d{2}:\d{2}:\d{2}$/.test(t[1])) continue;
    let tail = t.slice(15);
    if (tail.length && /^[\d.]+$/.test(tail[0])) tail = tail.slice(1);
    const zprava = tail[0] || "", osoba = tail[1] || "", sgrp = tail[2] || "";
    if (t[9] && t[10]) store.dispoNames[t[9]] = t[10];
    const key = `${t[5]}-${t[6]}-${t[12]}`;
    const stamp = `${datum} ${t[1]}`;
    const rec = map.get(key);
    if (rec) {
      rec.runs++;
      if (stamp > rec.stamp) { rec.stamp = stamp; rec.zprava = zprava; rec.mnozstvi = parseQty(t[13]); }
    } else {
      map.set(key, {
        key, doklad: t[5], pol: t[6], material: t[7], matText: t[8],
        dispo: t[9], mnozstvi: parseQty(t[13]), mj: t[14],
        zprava, osoba, sgrp, stamp, runs: 1, stav: "open"
      });
    }
  }
  return [...map.values()];
}

const PARSERS = { zakazky: parseZakazky, banfy: parseBanfy, chyby: parseChyby };

function importItems(type, items) {
  const prevDone = new Map((store[type] || [])
    .filter(i => i.stav === "done")
    .map(i => [i.key, i.vyrizeno]));
  items.forEach(i => {
    if (prevDone.has(i.key)) { i.stav = "done"; i.vyrizeno = prevDone.get(i.key); }
  });
  store[type] = items;
  saveStore();
  return items.length;
}

function importText(text) {
  const type = detectReport(text);
  if (!type) return null;
  return { type, count: importItems(type, PARSERS[type](text)) };
}

/* SAP exporty chodí občas ve windows-1252 — pozná se podle náhradního znaku */
function decodeBuffer(buf) {
  let text = new TextDecoder("utf-8", { fatal: false }).decode(buf);
  if (text.includes("\uFFFD")) text = new TextDecoder("windows-1252").decode(buf);
  return text;
}

/* ============================================================
   POMOCNÉ
   ============================================================ */

const tabState = {};
const findState = {};

let picked = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(KEY_DISPO));
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
})();
function savePicked() {
  try { localStorage.setItem(KEY_DISPO, JSON.stringify(picked)); } catch (e) {}
}
function pickMatch(i) { return picked.length === 0 || picked.includes(i.dispo); }
function dispoName(code) { return store.dispoNames[code] || ""; }
function allDispoCodes() {
  const s = new Set(picked);
  for (const t of Object.keys(MODULES)) (store[t] || []).forEach(i => i.dispo && s.add(i.dispo));
  return [...s].sort();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function fmtNum(n) { return Number(n).toLocaleString("cs-CZ"); }
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${Number(d)}. ${Number(m)}. ${y}`;
}
function fmtStamp(stamp) {
  if (!stamp) return "—";
  const [d, t] = stamp.split(" ");
  return `${fmtDate(d)} ${t ? t.slice(0, 5) : ""}`;
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function isoOffset(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function statePill(i, mod) {
  if (i.stav === "done") return `<span class="pill good">✓ ${mod.doneWord}${i.vyrizeno ? " " + fmtDate(i.vyrizeno) : ""}</span>`;
  if (mod.late(i)) return `<span class="pill bad">⚠ Po termínu</span>`;
  return `<span class="pill idle">Otevřeno</span>`;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 3600);
}

function patchItem(type, key, patch) {
  const item = (store[type] || []).find(i => i.key === key);
  if (item) Object.assign(item, patch);
  saveStore();
  return item;
}

function hasAnyData() {
  return Object.keys(MODULES).some(t => (store[t] || []).length > 0);
}

/* ============================================================
   VYKRESLENÍ
   ============================================================ */

function render() {
  const key = location.hash.replace("#", "");
  const app = document.getElementById("app");
  if (MODULES[key]) {
    app.innerHTML = viewReport(key);
    wireReport(key);
  } else {
    app.innerHTML = viewBoard();
    wireBoard();
  }
  window.scrollTo(0, 0);
}

function viewBoard() {
  const tiles = Object.entries(MODULES).map(([key, mod]) => {
    const items = (store[key] || []).filter(pickMatch);
    const open = items.filter(i => i.stav === "open");
    const late = open.filter(i => mod.late(i));
    const doneToday = items.filter(i => i.stav === "done" && i.vyrizeno === todayISO());
    let state;
    if (!items.length) state = `<span>zatím bez dat</span>`;
    else if (late.length) state = `<span class="bad">⚠ ${late.length} po termínu</span>`;
    else state = `<span>vše v termínu</span>`;
    return `
      <button class="tile" type="button" data-go="${key}" style="--tile-hue:${mod.hue}">
        <span class="tile-code">${mod.code}</span>
        <span class="tile-name">${mod.name}</span>
        <span class="tile-cz">${mod.cz}</span>
        <span class="tile-fig">${open.length}<i>${mod.unit}</i></span>
        <span class="tile-state">
          ${state}
          ${doneToday.length ? `<span class="good">✓ ${doneToday.length} dnes vyřízeno</span>` : ""}
        </span>
        <span class="tile-go">Otevřít report →</span>
      </button>`;
  }).join("");

  const onboarding = hasAnyData() ? "" : `
    <div class="onboard">
      <h3>Začni importem</h3>
      <p>Stránka si nic nestahuje ze SAPu sama — čte textové exporty, které si stáhneš ze ZATE. Data zůstávají jen v tomto prohlížeči.</p>
      <ol>
        <li>V SAPu spusť ZATE a report ulož jako lokální soubor (text s tabulátory).</li>
        <li>Nahoře klikni na <strong>Import ze ZATE</strong> a soubory vyber — <code>500116</code>, <code>212020</code> i <code>500108</code> naráz.</li>
        <li>Typ reportu se pozná sám podle hlavičky, nemusíš nic vybírat.</li>
      </ol>
      <button class="btn go" type="button" data-open-import="1">Import ze ZATE</button>
    </div>`;

  return `
    <p class="lede">Denní rutiny na jednom místě. Dlaždice ukazuje, kolik položek čeká —
    po rozkliknutí lze každou rovnou odbavit. Co odbavíš, zůstane odbavené i po zítřejším importu.</p>
    <div class="board">${tiles}</div>
    ${onboarding}`;
}

function viewReport(key) {
  const mod = MODULES[key];
  const tab = tabState[key] || "open";
  const q = (findState[key] || "").toLowerCase();
  const all = (store[key] || []).filter(pickMatch);

  let items = all.filter(i => tab === "all" || (tab === "open" ? i.stav === "open" : i.stav === "done"));
  if (q) items = items.filter(i => mod.find(i).some(f => String(f ?? "").toLowerCase().includes(q)));
  items = items.slice().sort(mod.sort);

  const rows = items.map(i => {
    const cells = mod.row(i)
      .map(c => typeof c === "object" ? `<td class="n">${c.n}</td>` : `<td>${c}</td>`)
      .join("");
    const act = i.stav === "open"
      ? `<button class="btn go" type="button" data-do="${esc(i.key)}">${mod.act}</button>`
      : `<button class="btn bare" type="button" data-undo="${esc(i.key)}">Vrátit</button>`;
    const cls = i.stav === "done" ? "settled" : (mod.late(i) ? "overdue" : "");
    return `<tr class="${cls}">${cells}<td>${statePill(i, mod)}</td><td class="n">${act}</td></tr>`;
  }).join("");

  const heads = mod.cols.map(c => {
    const t = typeof c === "object" ? c.t : c;
    const r = typeof c === "object" && c.r ? ' class="r"' : "";
    return `<th${r}>${t}</th>`;
  }).join("");

  const openCount = all.filter(i => i.stav === "open").length;
  const blank = all.length
    ? "V tomto filtru nic nezbylo."
    : "Žádná data — naimportuj export ze ZATE.";

  return `
    <div class="head" style="--hue:${mod.hue}">
      <a class="back" href="#">← Přehled</a>
      <span class="rule">/</span>
      <h2><span class="code">${mod.code}</span> · ${mod.name}</h2>
    </div>
    <p class="head-sub">${mod.cz} · ${openCount} otevřených</p>
    <div class="tools">
      <input type="search" id="find" placeholder="Hledat (doklad, materiál, dispo…)" value="${esc(findState[key] || "")}">
      <div class="seg">
        ${[["open", "Otevřené"], ["done", "Vyřízené"], ["all", "Vše"]].map(([v, l]) =>
          `<button type="button" data-tab="${v}" class="${tab === v ? "on" : ""}">${l}</button>`).join("")}
      </div>
    </div>
    <div class="sheet">
      <table>
        <thead><tr>${heads}</tr></thead>
        <tbody>${rows || `<tr><td colspan="${mod.cols.length}"><div class="blank">${blank}</div></td></tr>`}</tbody>
      </table>
    </div>`;
}

/* ---------- události ---------- */

function wireBoard() {
  document.querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => { location.hash = el.dataset.go; }));
  const imp = document.querySelector("[data-open-import]");
  if (imp) imp.addEventListener("click", openImport);
}

function wireReport(key) {
  const mod = MODULES[key];

  document.querySelectorAll("[data-tab]").forEach(b =>
    b.addEventListener("click", () => { tabState[key] = b.dataset.tab; render(); }));

  const find = document.getElementById("find");
  find.addEventListener("input", () => {
    findState[key] = find.value;
    const pos = find.selectionStart;
    render();
    const again = document.getElementById("find");
    again.focus();
    again.setSelectionRange(pos, pos);
  });

  document.querySelectorAll("[data-do]").forEach(b =>
    b.addEventListener("click", () => {
      const item = (store[key] || []).find(i => i.key === b.dataset.do);
      if (item) openConfirm(key, mod, item);
    }));

  document.querySelectorAll("[data-undo]").forEach(b =>
    b.addEventListener("click", () => {
      const item = patchItem(key, b.dataset.undo, { stav: "open", vyrizeno: undefined });
      if (item) toast(`Doklad ${item.doklad || item.banf} vrácen mezi otevřené.`);
      render();
    }));
}

/* ---------- dialog: potvrzení akce ---------- */

function openConfirm(key, mod, item) {
  const cfg = mod.dialog(item);
  const dlg = document.getElementById("dlg");
  dlg.innerHTML = `
    <form method="dialog" id="dlgForm">
      <div class="dlg-body">
        <h3>${esc(cfg.title)}</h3>
        <p class="dlg-sub">${esc(cfg.sub)}</p>
        ${cfg.fields.map(f => `
          <div class="f">
            <label for="x-${f.key}">${esc(f.label)}</label>
            <input id="x-${f.key}" name="${f.key}" type="${f.type}" value="${esc(f.value)}" required ${f.type === "number" ? 'min="0" step="any"' : ""}>
          </div>`).join("")}
      </div>
      <div class="dlg-foot">
        <button class="btn" value="cancel" formnovalidate>Zrušit</button>
        <button class="btn go" value="ok">${mod.act}</button>
      </div>
    </form>`;
  dlg.returnValue = "";
  dlg.showModal();
  /* click na OK — close/submit události u <dialog> nejsou všude spolehlivé */
  dlg.querySelector('[value="ok"]').addEventListener("click", () => {
    if (!dlg.querySelector("#dlgForm").checkValidity()) return;
    const payload = {};
    cfg.fields.forEach(f => { payload[f.key] = dlg.querySelector(`[name="${f.key}"]`).value; });
    patchItem(key, item.key, { stav: "done", vyrizeno: todayISO(), ...payload });
    toast(cfg.toast(payload));
    render();
  });
}

/* ---------- dialog: import ---------- */

function openImport() {
  const dlg = document.getElementById("dlg");
  dlg.innerHTML = `
    <form method="dialog" id="dlgForm">
      <div class="dlg-body">
        <h3>Import ze ZATE</h3>
        <p class="dlg-sub">Vyber stažené exporty — 500 116, 212 020 i 500 108 můžeš naráz. Typ reportu se pozná podle hlavičky. Vyřízené položky zůstanou vyřízené.</p>
        <div class="f">
          <label for="impFiles">Soubory</label>
          <input type="file" id="impFiles" multiple accept=".txt,text/plain">
        </div>
        <div class="f">
          <label for="impText">…nebo vlož text exportu</label>
          <textarea id="impText" placeholder="Zkopírovaný obsah exportu…"></textarea>
        </div>
      </div>
      <div class="dlg-foot">
        <button class="btn" value="cancel" formnovalidate>Zrušit</button>
        <button class="btn go" value="ok">Importovat</button>
      </div>
    </form>`;
  dlg.returnValue = "";
  dlg.showModal();
  dlg.querySelector('[value="ok"]').addEventListener("click", async () => {
    const files = [...dlg.querySelector("#impFiles").files];
    const pasted = dlg.querySelector("#impText").value.trim();
    const done = [], failed = [];

    for (const f of files) {
      const r = importText(decodeBuffer(await f.arrayBuffer()));
      if (r) done.push(`${MODULES[r.type].code}: ${r.count}`);
      else failed.push(f.name);
    }
    if (pasted) {
      const r = importText(pasted);
      if (r) done.push(`${MODULES[r.type].code}: ${r.count}`);
      else failed.push("vložený text");
    }

    if (!done.length && !failed.length) toast("Nebylo co importovat — vyber soubor nebo vlož text.");
    else if (!done.length) toast(`Nerozpoznáno: ${failed.join(", ")}. Čekám hlavičku reportu ZATE.`);
    else toast(`Naimportováno — ${done.join(" · ")}${failed.length ? ` · nerozpoznáno: ${failed.join(", ")}` : ""}`);

    drawPicker();
    render();
  });
}

        <h3>Vymazat všechna data?</h3>

      </div>
      <div class="dlg-foot">
        <button class="btn" value="cancel" formnovalidate>Zrušit</button>

  });
}

/* ---------- výběr dispo kódů ---------- */

function drawPicker() {
  document.getElementById("pickLabel").textContent =
    picked.length ? `Dispo: ${picked.join(", ")}` : "Dispo: vše";

  const box = document.getElementById("pickOpts");
  const codes = allDispoCodes();
  box.innerHTML = codes.length
    ? codes.map(c => `
        <label>
          <input type="checkbox" value="${esc(c)}" ${picked.includes(c) ? "checked" : ""}>
          <span><span class="c">${esc(c)}</span> <span class="d">${esc(dispoName(c))}</span></span>
        </label>`).join("")
    : `<div class="hint">Zatím žádné kódy — naimportuj data.</div>`;

  box.querySelectorAll("input").forEach(cb =>
    cb.addEventListener("change", () => {
      picked = [...box.querySelectorAll("input:checked")].map(x => x.value).sort();
      savePicked();
      drawPicker();
      render();
    }));
}

/* ============================================================
   START
   ============================================================ */

document.getElementById("today").textContent =
  new Date().toLocaleDateString("cs-CZ", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

document.getElementById("btnImport").addEventListener("click", openImport);
document.getElementById("btnWipe").addEventListener("click", openWipe);

document.getElementById("pickClear").addEventListener("click", () => {
  picked = [];
  savePicked();
  drawPicker();
  render();
  document.getElementById("pick").open = false;
});

document.addEventListener("click", e => {
  const d = document.getElementById("pick");
  if (d.open && !d.contains(e.target)) d.open = false;
});

window.addEventListener("hashchange", render);

loadStore();
drawPicker();
render();
</script>
